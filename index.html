    <div class="countdown-container" id="countdown-area">
        <span id="days">00</span><span class="colon">:</span>
        <span id="hours">00</span><span class="colon">:</span>
        <span id="minutes">00</span><span class="colon">:</span>
        <span id="seconds">00</span>
    </div>

    <div class="message-container" id="message-area">
        We meet again!
    </div>

    <script>
        const targetDate = new Date("Dec 5, 2026 00:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference < 0) {
                document.getElementById("img-area").style.display = "none";
                document.getElementById("countdown-area").style.display = "none";
                document.getElementById("message-area").style.display = "block";
                clearInterval(intervalId);
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
        }

        updateCountdown();
        const intervalId = setInterval(updateCountdown, 1000);
    </script>
